[package]
name = "emacs-reporter"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "emacs-report-uploader"
path = "src/bin/emacs-report-uploader.rs"

[[bin]]
name = "emacs-report-merge"
path = "src/bin/emacs-report-merge.rs"
required-features = ["merge"]

[features]
merge = []

[dependencies]
anyhow = "1.0.102"
bzip2 = "0.6.1"
chrono = "0.4.44"
getrandom = "0.4.2"
libc = "0.2.183"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1.50.0", features = ["full", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.3.0"
uuid = { version = "1.22.0", features = ["v4", "v5"] }
